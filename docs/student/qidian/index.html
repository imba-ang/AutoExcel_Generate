<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>起点｜先留下第一反应</title>
  <link rel="stylesheet" href="/AutoExcel_Generate/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/AutoExcel_Generate/">创意有方</a>
    <span class="brand-note">4·4·4 创新方案生成表</span>
  </header>
  <main class="page-shell">
    
<section class="form-heading section-qidian">
  <p class="eyebrow">准备阶段</p>
  <h1>起点｜先留下第一反应</h1>
</section>
<div id="message" class="message" role="status" aria-live="polite"></div>

<section class="sheet-panel">
  <div class="sheet-tabbar">
    <span class="sheet-stack" aria-hidden="true">◇</span>
    <strong>起点表</strong>
  </div>
  <div class="sheet-scroll">
    <table class="excel-grid" data-section="qidian">
      <colgroup>
        <col class="row-number-column">
        <col style="width:89px"><col style="width:96px"><col style="width:97px"><col style="width:96px"><col style="width:89px"><col style="width:88px"><col style="width:90px">
      </colgroup>
      <thead>
        <tr>
          <th class="sheet-corner"></th>
          <th class="sheet-column">A</th><th class="sheet-column">B</th><th class="sheet-column">C</th><th class="sheet-column">D</th><th class="sheet-column">E</th><th class="sheet-column">F</th><th class="sheet-column">G</th>
        </tr>
      </thead>
      <tbody>
      
        <tr style="--row-height:37px;height:37px">
        <th class="sheet-row">1</th>
        
          <td class="fixed-cell"
              colspan="7" rowspan="1" style="background-color:#D9EAF7;font-family:Carlito,&#39;Microsoft YaHei&#39;,sans-serif;font-size:12.0pt;font-weight:700;text-align:center;vertical-align:middle;white-space:pre-wrap;padding-left:0;padding-right:0;text-indent:0;text-align:center;vertical-align:middle"
              data-coordinate="A5"
              >
            
              <span class="cell-value fixed-text">起点｜先留下第一反应</span>
            
          </td>
        
        </tr>
      
        <tr style="--row-height:37px;height:37px">
        <th class="sheet-row">2</th>
        
          <td class="fixed-cell"
              colspan="2" rowspan="1" style="background-color:#EAF2F8;font-family:Carlito,&#39;Microsoft YaHei&#39;,sans-serif;font-size:11.0pt;font-weight:700;text-align:center;vertical-align:middle;border-top:1px solid #BFBFBF;border-right:1px solid #D9D9D9;border-left:1px solid #BFBFBF;padding-left:0;padding-right:0;text-indent:0;text-align:center;vertical-align:middle"
              data-coordinate="A6"
              >
            
              <span class="cell-value fixed-text">原始问题</span>
            
          </td>
        
          <td class="input-cell"
              colspan="5" rowspan="1" style="font-family:Carlito,&#39;Microsoft YaHei&#39;,sans-serif;font-size:11.0pt;vertical-align:middle;white-space:pre-wrap;border-top:1px solid #BFBFBF;border-right:1px solid #D9D9D9;border-bottom:1px solid #D9D9D9;border-left:1px solid #D9D9D9"
              data-coordinate="C6"
              >
            
              <div class="cell-editor">
                
                <textarea class="cell-input" data-cell="C6" aria-label="C6 填写内容" placeholder="请填写"></textarea>
              </div>
            
          </td>
        
        </tr>
      
        <tr style="--row-height:37px;height:37px">
        <th class="sheet-row">3</th>
        
          <td class="fixed-cell"
              colspan="2" rowspan="1" style="background-color:#EAF2F8;font-family:Carlito,&#39;Microsoft YaHei&#39;,sans-serif;font-size:11.0pt;font-weight:700;text-align:center;vertical-align:middle;white-space:pre-wrap;border-top:1px solid #D9D9D9;border-right:1px solid #D9D9D9;border-left:1px solid #BFBFBF;padding-left:0;padding-right:0;text-indent:0;text-align:center;vertical-align:middle"
              data-coordinate="A7"
              >
            
              <span class="cell-value fixed-text">第一答案</span>
            
          </td>
        
          <td class="input-cell"
              colspan="5" rowspan="1" style="font-family:Carlito,&#39;Microsoft YaHei&#39;,sans-serif;font-size:11.0pt;vertical-align:middle;white-space:pre-wrap;border-top:1px solid #D9D9D9;border-right:1px solid #D9D9D9;border-bottom:1px solid #D9D9D9;border-left:1px solid #D9D9D9"
              data-coordinate="C7"
              >
            
              <div class="cell-editor">
                
                <textarea class="cell-input" data-cell="C7" aria-label="C7 填写内容" placeholder="请填写"></textarea>
              </div>
            
          </td>
        
        </tr>
      
      </tbody>
    </table>
  </div>
</section>

<div class="submit-bar">
  <span>提交后可继续修改</span>
  <button type="button" class="button button-primary" id="submit-form">提交</button>
</div>

  </main>
  
<script src="/AutoExcel_Generate/static/student.js" defer></script>

</body>
</html>

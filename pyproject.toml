[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoexcel-generate"
version = "0.1.0"
description = "面向学生扫码填写和教师汇总下载的在线 Excel 系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "qrcode[pil]>=8,<9",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]


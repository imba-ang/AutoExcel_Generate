{% extends "base.html" %}
{% block title %}固定二维码{% endblock %}
{% block content %}
<div class="dashboard-heading">
  <div><p class="eyebrow">教师端</p><h1>学生扫码入口</h1><p>当前二维码基于：{{ public_base_url }}</p></div>
  <a class="button button-secondary" href="/teacher">返回工作台</a>
</div>
<section class="qr-grid">
  {% for item in qr_items %}
  <article class="qr-card section-{{ item.section.slug }}">
    <h2>{{ item.section.label }}｜{{ item.section.subtitle }}</h2>
    <img src="{{ item.image_url }}" alt="{{ item.section.label }}二维码">
    <code>{{ item.url }}</code>
    <a class="button button-primary" href="{{ item.image_url }}?download=true">下载二维码</a>
  </article>
  {% endfor %}
</section>
{% endblock %}
